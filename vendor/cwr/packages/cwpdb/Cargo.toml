[package]
name = "cwpdb"
version = "0.1.0"
description = "Shared SQLite property graph and native storage bridge"
authors = ["Bolt Foundry"]
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
test-support = []

[lints]
workspace = true

[lib]
name = "cwpdb"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
toml = "0.8"
tempfile = "3"
