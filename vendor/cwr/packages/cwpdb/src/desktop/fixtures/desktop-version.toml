type = "cwp://org.coworkerprotocol/2026-10-22/schemas/entity-definition"
ref = "cwp://org.coworkerprotocol/cwr/entities/desktop-version"
storage = "cwpdb"
record_kind = "desktop_workspace_version_v1"
record_schema = "cwp://org.coworkerprotocol/cwpdb/schemas/desktop_workspace_version_v1/2026-09"
[value_schema]
type = "object"
additionalProperties = false
required = ["record"]
[value_schema.properties.record]
type = "object"
additionalProperties = false
required = ["id", "files", "folders"]
[value_schema.properties.record.properties.id]
type = "string"
minLength = 1
maxLength = 1024
[value_schema.properties.record.properties.files]
type = "array"
[value_schema.properties.record.properties.files.items]
type = "object"
additionalProperties = false
required = ["path", "data", "mode"]
[value_schema.properties.record.properties.files.items.properties.path]
type = "string"
minLength = 1
[value_schema.properties.record.properties.files.items.properties.data]
type = "string"
[value_schema.properties.record.properties.files.items.properties.mode]
type = "integer"
minimum = 0
maximum = 511
[value_schema.properties.record.properties.folders]
type = "array"
[value_schema.properties.record.properties.folders.items]
type = "string"
