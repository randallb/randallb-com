value_schema = { "type" = "object", "anyOf" = [{ "required" = ["record"] }, { "required" = ["streaming"] }], "properties" = { "record" = { "type" = "object", "required" = ["message_ref", "author_actor_ref", "addressed_actor_refs", "text"], "properties" = { "message_ref" = { "type" = "string" }, "author_actor_ref" = { "type" = "string" }, "addressed_actor_refs" = { "type" = "array", "items" = { "type" = "string" } }, "text" = { "type" = "string" } } } } }
