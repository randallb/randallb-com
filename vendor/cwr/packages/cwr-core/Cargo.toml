[package]
name = "cwr-core"
version = "0.1.0"
description = "Portable CWR core primitives and contracts"
authors = ["Bolt Foundry"]
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
test-read-metrics = []

[lints]
workspace = true

[lib]
name = "cwr"
path = "src/lib.rs"

[[test]]
name = "process_adapter"
path = "tests/process_adapter.rs"

[dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }
caseless = "0.2.2"
cwpdb_store = { package = "cwpdb", path = "../cwpdb" }
dirs = "6"
jsonschema = { version = "0.49.9", default-features = false }
hex = "0.4"
libc = "0.2"
pulldown-cmark = "0.13.6"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
socket2 = "0.6"
toml = "0.8"
toml_edit = "0.20"
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-o200k_base"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
cwpdb_store = { package = "cwpdb", path = "../cwpdb", features = ["test-support"] }
