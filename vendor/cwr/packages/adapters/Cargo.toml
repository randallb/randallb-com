[package]
name = "cwr-adapters"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
name = "cwr_adapters"
path = "src/lib.rs"

[[bin]]
name = "cwr-adapter-loopback"
path = "src/bin/cwr-adapter-loopback.rs"

[[bin]]
name = "cwr-adapter-cloud"
path = "src/bin/cwr-adapter-cloud.rs"

[[bin]]
name = "cwr-adapter-rng"
path = "src/bin/cwr-adapter-rng.rs"

[[bin]]
name = "cwr-adapter-sh"
path = "src/bin/cwr-adapter-sh.rs"

[[bin]]
name = "cwr-adapter-smolvm-sh"
path = "src/bin/cwr-adapter-smolvm-sh.rs"

[[bin]]
name = "cwr-adapter-codex"
path = "src/bin/cwr-adapter-codex.rs"

[[test]]
name = "codex"
path = "src/adapter/codex/tests.rs"

[[bin]]
name = "cwr-adapter-claude"
path = "src/bin/cwr-adapter-claude.rs"

[[test]]
name = "claude"
path = "src/adapter/claude/tests.rs"

[[bin]]
name = "cwr-adapter-open-responses"
path = "src/bin/cwr-adapter-open-responses.rs"

[[test]]
name = "open_responses"
path = "src/adapter/open_responses/tests.rs"

[[bin]]
name = "cwr-adapter-decisions"
path = "src/bin/cwr-adapter-decisions.rs"

[[test]]
name = "decisions"
path = "src/adapter/decisions/tests.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
cwr-core = { path = "../cwr-core" }
jsonschema = { version = "0.49.9", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.8"

[dev-dependencies]
schemars = "1"
