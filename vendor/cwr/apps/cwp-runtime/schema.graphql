type Mutation {
	invokeAction(url: ID!, activation: String!, input: JSON!, requestId: ID!): ActionResult!
	ingestFile(filename: String!, mediaType: String!, contentBase64: String!): FileMetadata!
	registerTerminalProvider(coworkers: [TerminalCoworkerInput!]!): ID!
	enableTerminalCoworker(providerSessionRef: ID!, actorRef: ID!, enabled: Boolean!): Boolean!
	completeTerminalWork(invocationRef: ID!, terminal: JSON!): Boolean!
