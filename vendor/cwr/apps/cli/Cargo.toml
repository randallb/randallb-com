[package]
name = "cwr-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[[bin]]
name = "cwr"
path = "src/main.rs"

[dependencies]
tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
cwr = { package = "cwr-core", path = "../../packages/cwr-core" }
libc = "0.2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
