name: Site and CWR checks
on:
  push:
    branches: [integrate-live-placeholder]
  pull_request:
concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Site checks
        run: deno task check
      - name: Build pinned CWR
        run: sh scripts/cwr-setup.sh
      - name: Real CWR success, failure and restoration
        run: python3 scripts/cwr-verify.py
