name: Literate libcwr Wasm
on:
  pull_request:
    paths:
      - projects/bel-wasm/**
      - .github/workflows/libcwr.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: libcwr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/bel-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - name: Bootstrap existing rbel compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --locked -p bel-rust-repl --bins
          npm install --prefix target/bel-wasm-tools --no-save --ignore-scripts wabt@1.0.39
          python3 experiments/bel-rust-repl/wasm/verify-selfhost.py
          python3 literate/bootstrap-wasm.py
      - name: Verify exact numbers, explicit floats and reader examples
        run: |
          python3 literate/test.py literate/integers.rbel.md --rbel target/rbel-wasm-bootstrap/bin/rbel --report target/integer-examples.json
          python3 literate/test.py literate/floats.rbel.md --include literate/integers.rbel.md --rbel target/rbel-wasm-bootstrap/bin/rbel --report target/float-examples.json
          python3 experiments/bel-rust-repl/wasm/command/verify-numbers.py --rbel target/rbel-wasm-bootstrap/bin/rbel --portable
          python3 literate/test.py literate/reader.rbel.md --include literate/integers.rbel.md --include literate/floats.rbel.md --rbel target/rbel-wasm-bootstrap/bin/rbel --report target/reader-examples.json
      - name: Verify actual libcwr Wasm and runner failures
        run: python3 libcwr/verify.py --rbel target/rbel-wasm-bootstrap/bin/rbel --skip-native
      - name: Package and verify embedded core and native host
        run: |
          python3 libcwr/embedding/build.py --rbel target/rbel-wasm-bootstrap/bin/rbel
          python3 libcwr/embedding/build-native.py
          python3 libcwr/embedding/verify.py --rbel target/rbel-wasm-bootstrap/bin/rbel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libcwr-evidence
          path: |
            projects/bel-wasm/target/integer-examples.json
            projects/bel-wasm/target/reader-examples.json
            projects/bel-wasm/target/float-examples.json
            projects/bel-wasm/target/numeric-verification/
            projects/bel-wasm/target/libcwr/results.json
            projects/bel-wasm/target/libcwr/verification.json
            projects/bel-wasm/target/libcwr-embedding-checks/
            projects/bel-wasm/target/libcwr-embedding/manifest.json
            projects/bel-wasm/target/libcwr-embedding/libcwr.json
          if-no-files-found: error
